<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 1112" role="img" aria-labelledby="title desc"><title id="title">switch / checkout：書式・説明・オプション</title><desc id="desc">git checkout &lt;commit ID&gt;。git switch &lt;branch name&gt;。checkoutはブランチ・commitへの移動と、ファイルの復元を扱う。。switchはブランチ操作に用途を絞ったコマンド。。checkout。&lt;branch&gt;：指定したブランチへ切り替える。。-b &lt;branch&gt;：ブランチを作成して切り替える。。-：直前にいたブランチへ戻る。。&lt;commit ID&gt;：指定したcommitへ移動する（detached HEAD）。。&lt;commit ID&gt; -- &lt;file&gt;：指定commitのファイルをindexとworking treeへ復元する。。-- .：カレントディレクトリ以下の未ステージ変更を取り消す。。switch。&lt;branch&gt;：指定したブランチへ切り替える。。-c &lt;branch&gt;：ブランチを作成して切り替える。。-：直前にいたブランチへ戻る。。--detach &lt;commit ID&gt;：指定したcommitを直接開く。。checkoutによるファイル復元は未commitの編集を上書きする。実行前に対象を確認する。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git checkout &lt;commit ID&gt;</text>
<rect x="30" y="104" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="138" font-size="27" class="command" text-anchor="start">git switch &lt;branch name&gt;</text>
<text x="44" y="217" font-size="24" class="" text-anchor="start">checkoutはブランチ・commitへの移動と、ファイルの復元を扱う。</text>
<text x="44" y="265" font-size="24" class="" text-anchor="start">switchはブランチ操作に用途を絞ったコマンド。</text>
<text x="35" y="313" font-size="25" class="heading" text-anchor="start">checkout</text><path d="M35 326h500" stroke="#868e8b"/><rect x="35" y="349" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="374" font-size="21" class="mono" text-anchor="start">&lt;branch&gt;</text><text x="262" y="374" font-size="23" class="" text-anchor="start">指定したブランチへ切り</text><text x="262" y="408" font-size="23" class="" text-anchor="start">替える。</text><rect x="35" y="443" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="468" font-size="21" class="mono" text-anchor="start">-b &lt;branch&gt;</text><text x="262" y="468" font-size="23" class="" text-anchor="start">ブランチを作成して切り</text><text x="262" y="502" font-size="23" class="" text-anchor="start">替える。</text><rect x="35" y="537" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="562" font-size="21" class="mono" text-anchor="start">-</text><text x="262" y="562" font-size="23" class="" text-anchor="start">直前にいたブランチへ戻</text><text x="262" y="596" font-size="23" class="" text-anchor="start">る。</text><rect x="35" y="631" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="656" font-size="21" class="mono" text-anchor="start">&lt;commit ID&gt;</text><text x="262" y="656" font-size="23" class="" text-anchor="start">指定したcommitへ移動す</text><text x="262" y="690" font-size="23" class="" text-anchor="start">る（detached HEAD）。</text><rect x="35" y="725" width="205" height="75" rx="4" fill="#f7f9f8"/><text x="47" y="750" font-size="21" class="mono" text-anchor="start">&lt;commit ID&gt; --</text><text x="47" y="781" font-size="21" class="mono" text-anchor="start"> &lt;file&gt;</text><text x="262" y="750" font-size="23" class="" text-anchor="start">指定commitのファイルを</text><text x="262" y="784" font-size="23" class="" text-anchor="start">indexとworking tree</text><text x="262" y="818" font-size="23" class="" text-anchor="start">へ復元する。</text><rect x="35" y="853" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="878" font-size="21" class="mono" text-anchor="start">-- .</text><text x="262" y="878" font-size="23" class="" text-anchor="start">カレントディレクトリ以</text><text x="262" y="912" font-size="23" class="" text-anchor="start">下の未ステージ変更を取</text><text x="262" y="946" font-size="23" class="" text-anchor="start">り消す。</text>
<text x="570" y="313" font-size="25" class="heading" text-anchor="start">switch</text><path d="M570 326h500" stroke="#868e8b"/><rect x="570" y="349" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="374" font-size="21" class="mono" text-anchor="start">&lt;branch&gt;</text><text x="797" y="374" font-size="23" class="" text-anchor="start">指定したブランチへ切り</text><text x="797" y="408" font-size="23" class="" text-anchor="start">替える。</text><rect x="570" y="443" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="468" font-size="21" class="mono" text-anchor="start">-c &lt;branch&gt;</text><text x="797" y="468" font-size="23" class="" text-anchor="start">ブランチを作成して切り</text><text x="797" y="502" font-size="23" class="" text-anchor="start">替える。</text><rect x="570" y="537" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="562" font-size="21" class="mono" text-anchor="start">-</text><text x="797" y="562" font-size="23" class="" text-anchor="start">直前にいたブランチへ戻</text><text x="797" y="596" font-size="23" class="" text-anchor="start">る。</text><rect x="570" y="631" width="205" height="75" rx="4" fill="#f7f9f8"/><text x="582" y="656" font-size="21" class="mono" text-anchor="start">--detach</text><text x="582" y="687" font-size="21" class="mono" text-anchor="start">&lt;commit ID&gt;</text><text x="797" y="656" font-size="23" class="" text-anchor="start">指定したcommitを直接開</text><text x="797" y="690" font-size="23" class="" text-anchor="start">く。</text>
<text x="40" y="1024" font-size="21" class="muted" text-anchor="start">checkoutによるファイル復元は未commitの編集を上書きする。実行前に対象を確認する。</text></svg>
