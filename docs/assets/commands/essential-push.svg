<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 950" role="img" aria-labelledby="title desc"><title id="title">push：書式・説明・オプション</title><desc id="desc">git push &lt;repository&gt; &lt;local ref&gt;:&lt;remote ref&gt;。git push origin main:main。手元の記録済みcommitを送信し、リモートの参照を更新する。。Args。&lt;repository&gt;：送信先のURLや名前。例ではoriginを指定する。。&lt;local ref&gt;：送信元のブランチなどの参照。例ではmain。。&lt;remote ref&gt;：送信先で更新する参照。例ではmain。。Options。-u / --set-upstream：送信したローカルブランチに、リモート側の追跡先を設定する。。-f / --force：通常の履歴更新の保護を外して送信する。共有履歴を上書きし得る。。--force-with-lease：リモート参照が期待した値のままの場合に限り、強制更新する。。引数を省略したときの送信先・参照は設定にも依存する。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git push &lt;repository&gt; &lt;local ref&gt;:&lt;remote ref&gt;</text>
<rect x="30" y="104" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="138" font-size="27" class="command" text-anchor="start">git push origin main:main</text>
<text x="44" y="217" font-size="24" class="" text-anchor="start">手元の記録済みcommitを送信し、リモートの参照を更新する。</text>
<text x="35" y="265" font-size="25" class="heading" text-anchor="start">Args</text><path d="M35 278h1030" stroke="#868e8b"/><rect x="35" y="301" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="326" font-size="23" class="mono" text-anchor="start">&lt;repository&gt;</text><text x="402" y="326" font-size="23" class="" text-anchor="start">送信先のURLや名前。例ではoriginを指定する。</text><rect x="35" y="361" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="386" font-size="23" class="mono" text-anchor="start">&lt;local ref&gt;</text><text x="402" y="386" font-size="23" class="" text-anchor="start">送信元のブランチなどの参照。例ではmain。</text><rect x="35" y="421" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="446" font-size="23" class="mono" text-anchor="start">&lt;remote ref&gt;</text><text x="402" y="446" font-size="23" class="" text-anchor="start">送信先で更新する参照。例ではmain。</text>
<text x="35" y="501" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 514h1030" stroke="#868e8b"/><rect x="35" y="537" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="562" font-size="23" class="mono" text-anchor="start">-u / --set-upstream</text><text x="402" y="562" font-size="23" class="" text-anchor="start">送信したローカルブランチに、リモート側の追跡先を設定する</text><text x="402" y="596" font-size="23" class="" text-anchor="start">。</text><rect x="35" y="631" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="656" font-size="23" class="mono" text-anchor="start">-f / --force</text><text x="402" y="656" font-size="23" class="" text-anchor="start">通常の履歴更新の保護を外して送信する。共有履歴を上書きし</text><text x="402" y="690" font-size="23" class="" text-anchor="start">得る。</text><rect x="35" y="725" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="750" font-size="23" class="mono" text-anchor="start">--force-with-lease</text><text x="402" y="750" font-size="23" class="" text-anchor="start">リモート参照が期待した値のままの場合に限り、強制更新する</text><text x="402" y="784" font-size="23" class="" text-anchor="start">。</text>
<text x="40" y="862" font-size="21" class="muted" text-anchor="start">引数を省略したときの送信先・参照は設定にも依存する。</text></svg>
