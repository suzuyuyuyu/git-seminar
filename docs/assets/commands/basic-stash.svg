<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 944" role="img" aria-labelledby="title desc"><title id="title">stash：書式・説明・オプション</title><desc id="desc">git stash &lt;subcommand&gt; &lt;option&gt;。working treeやindexの途中の変更を、一時的に退避する。。pullや作業の切り替えの前に、手元の変更をいったん置いておく。。Subcommands：退避と確認。save &quot;comment&quot;：説明付きで退避する従来の書き方。新しい例では push -m &quot;comment&quot; を使う。。list：退避の一覧を表示する。。apply：退避を作業ツリーへ適用する。退避は残る。。Subcommands：適用と削除。pop：退避を適用し、成功したら退避を削除する。。show：退避に含まれる差分の要約を表示する。。drop / clear：指定・最新の退避を削除する / すべての退避を削除する。。Options。-u：未追跡ファイルも退避する。。-a：未追跡ファイルに加え、ignore対象のファイルも退避する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git stash &lt;subcommand&gt; &lt;option&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">working treeやindexの途中の変更を、一時的に退避する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">pullや作業の切り替えの前に、手元の変更をいったん置いておく。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">Subcommands：退避と確認</text><path d="M35 252h500" stroke="#868e8b"/><rect x="35" y="275" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="21" class="mono" text-anchor="start">save &quot;comment&quot;</text><text x="262" y="300" font-size="23" class="" text-anchor="start">説明付きで退避する従来</text><text x="262" y="334" font-size="23" class="" text-anchor="start">の書き方。新しい例では</text><text x="262" y="368" font-size="23" class="" text-anchor="start">push -m &quot;comment&quot; を</text><text x="262" y="402" font-size="23" class="" text-anchor="start">使う。</text><rect x="35" y="437" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="462" font-size="21" class="mono" text-anchor="start">list</text><text x="262" y="462" font-size="23" class="" text-anchor="start">退避の一覧を表示する。</text><rect x="35" y="497" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="522" font-size="21" class="mono" text-anchor="start">apply</text><text x="262" y="522" font-size="23" class="" text-anchor="start">退避を作業ツリーへ適用</text><text x="262" y="556" font-size="23" class="" text-anchor="start">する。退避は残る。</text>
<text x="570" y="239" font-size="25" class="heading" text-anchor="start">Subcommands：適用と削除</text><path d="M570 252h500" stroke="#868e8b"/><rect x="570" y="275" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="300" font-size="21" class="mono" text-anchor="start">pop</text><text x="797" y="300" font-size="23" class="" text-anchor="start">退避を適用し、成功した</text><text x="797" y="334" font-size="23" class="" text-anchor="start">ら退避を削除する。</text><rect x="570" y="369" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="394" font-size="21" class="mono" text-anchor="start">show</text><text x="797" y="394" font-size="23" class="" text-anchor="start">退避に含まれる差分の要</text><text x="797" y="428" font-size="23" class="" text-anchor="start">約を表示する。</text><rect x="570" y="463" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="582" y="488" font-size="21" class="mono" text-anchor="start">drop / clear</text><text x="797" y="488" font-size="23" class="" text-anchor="start">指定・最新の退避を削除</text><text x="797" y="522" font-size="23" class="" text-anchor="start">する / すべての退避を削</text><text x="797" y="556" font-size="23" class="" text-anchor="start">除する。</text>
<text x="35" y="611" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 624h500" stroke="#868e8b"/><rect x="35" y="647" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="672" font-size="21" class="mono" text-anchor="start">-u</text><text x="262" y="672" font-size="23" class="" text-anchor="start">未追跡ファイルも退避す</text><text x="262" y="706" font-size="23" class="" text-anchor="start">る。</text><rect x="35" y="741" width="205" height="44" rx="4" fill="#f7f9f8"/><text x="47" y="766" font-size="21" class="mono" text-anchor="start">-a</text><text x="262" y="766" font-size="23" class="" text-anchor="start">未追跡ファイルに加え、</text><text x="262" y="800" font-size="23" class="" text-anchor="start">ignore対象のファイルも</text><text x="262" y="834" font-size="23" class="" text-anchor="start">退避する。</text></svg>
