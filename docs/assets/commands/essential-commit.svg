<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">commit：書式・説明・オプション</title><desc id="desc">git commit -m &lt;commit message&gt;。indexにあるファイルのスナップショットを記録する。。-m &lt;commit message&gt; で変更の内容や理由を記述する。。-mを省略すると、Vimなど設定されたエディターが開く。。メッセージに feat:、fix:、update: などのprefixを付ける運用もある。。Options。--amend：直前のcommitを新しいcommitで置き換える。メッセージや記録する内容を修正できる。。--verbose：メッセージ編集時に、commitする変更の差分も表示する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git commit -m &lt;commit message&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">indexにあるファイルのスナップショットを記録する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">-m &lt;commit message&gt; で変更の内容や理由を記述する。</text>
<text x="44" y="239" font-size="24" class="" text-anchor="start">-mを省略すると、Vimなど設定されたエディターが開く。</text>
<text x="44" y="287" font-size="24" class="" text-anchor="start">メッセージに feat:、fix:、update: などのprefixを付ける運用もある。</text>
<text x="35" y="335" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 348h1030" stroke="#868e8b"/><rect x="35" y="371" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="396" font-size="23" class="mono" text-anchor="start">--amend</text><text x="402" y="396" font-size="23" class="" text-anchor="start">直前のcommitを新しいcommitで置き換える。メッセージや記</text><text x="402" y="430" font-size="23" class="" text-anchor="start">録する内容を修正できる。</text><rect x="35" y="465" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="490" font-size="23" class="mono" text-anchor="start">--verbose</text><text x="402" y="490" font-size="23" class="" text-anchor="start">メッセージ編集時に、commitする変更の差分も表示する。</text></svg>
