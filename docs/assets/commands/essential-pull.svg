<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">pull：書式・説明・オプション</title><desc id="desc">git pull。リモートの更新を取得し、現在のブランチへ取り込む。。mergeによる取り込みは、fetchに続けてmerge FETCH_HEADを実行する流れになる。。統合方法は指定や設定による。この教材の使用例では --ff-only を明示する。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git pull</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">リモートの更新を取得し、現在のブランチへ取り込む。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">mergeによる取り込みは、fetchに続けてmerge FETCH_HEADを実行する流れになる。</text>
<g transform="translate(0 230)"><rect x="20" y="5" width="645" height="150" rx="6" fill="#f7f9f8"/><text x="40" y="38" font-size="24" class="heading" text-anchor="start">リモート</text><text x="55" y="83" font-size="22" class="" text-anchor="start">repo. a</text><text x="55" y="130" font-size="22" class="" text-anchor="start">repo. b</text><path d="M205 75H600 M205 97H560 M205 125H600" stroke="#5f6563" stroke-width="4"/><text x="610" y="80" font-size="20" class="" text-anchor="start">main</text><text x="570" y="101" font-size="20" class="" text-anchor="start">develop</text><text x="610" y="132" font-size="20" class="" text-anchor="start">main</text><rect x="20" y="183" width="645" height="232" rx="6" fill="#f7f9f8"/><text x="40" y="215" font-size="24" class="heading" text-anchor="start">ローカル</text><text x="45" y="247" font-size="20" class="" text-anchor="start">remote tracking branch</text><path d="M340 240H610" stroke="#5f6563" stroke-width="3"/><text x="45" y="280" font-size="20" class="" text-anchor="start">local branch</text><path d="M340 273H610" stroke="#5f6563" stroke-width="3"/><text x="45" y="313" font-size="20" class="" text-anchor="start">index</text><path d="M340 306H610" stroke="#5f6563" stroke-width="3"/><text x="45" y="346" font-size="20" class="" text-anchor="start">working tree</text><path d="M340 339H610" stroke="#5f6563" stroke-width="3"/><text x="45" y="379" font-size="20" class="" text-anchor="start">stash</text><path d="M340 372H610" stroke="#5f6563" stroke-width="3"/><text x="475" y="240" font-size="20" class="" text-anchor="start">origin/main</text><text x="550" y="274" font-size="20" class="" text-anchor="start">main</text><path d="M420 127V239" stroke="#0090ff" stroke-width="5" marker-end="url(#blue-arrow)"/><text x="444" y="183" font-size="24" class="mono" text-anchor="start">fetch</text><path d="M540 241V273" stroke="#e54d2e" stroke-width="5" marker-end="url(#warm-arrow)"/><text x="585" y="291" font-size="23" class="mono" text-anchor="start">merge</text><text x="735" y="184" font-size="23" class="" text-anchor="start">リモート追跡ブランチを更新</text><text x="735" y="292" font-size="23" class="" text-anchor="start">取得した内容を</text><text x="735" y="326" font-size="23" class="" text-anchor="start">ローカルブランチへ統合</text><path d="M706 139V354" fill="none" stroke="#218358" stroke-width="2"/><text x="736" y="393" font-size="25" class="heading" text-anchor="start">pull は取得と統合</text></g>
<text x="40" y="722" font-size="21" class="muted" text-anchor="start">統合方法は指定や設定による。この教材の使用例では --ff-only を明示する。</text></svg>
