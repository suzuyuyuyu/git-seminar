<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">tag：書式・説明・オプション</title><desc id="desc">git tag -a &lt;tag name&gt; -m &lt;message&gt;。公開版などの特定commitに名前を付ける。。ブランチと違い、新しくcommitしても指す先は自動では進まない。。作成と共有。-a / -m：注釈付きタグを作成し、説明を付ける。。git show v1.0.0：タグが指す版と説明を確認する。。git push origin v1.0.0：共有するタグを明示して送信する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git tag -a &lt;tag name&gt; -m &lt;message&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">公開版などの特定commitに名前を付ける。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">ブランチと違い、新しくcommitしても指す先は自動では進まない。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">作成と共有</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">-a / -m</text><text x="402" y="300" font-size="23" class="" text-anchor="start">注釈付きタグを作成し、説明を付ける。</text><rect x="35" y="335" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="360" font-size="23" class="mono" text-anchor="start">git show v1.0.0</text><text x="402" y="360" font-size="23" class="" text-anchor="start">タグが指す版と説明を確認する。</text><rect x="35" y="395" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="420" font-size="23" class="mono" text-anchor="start">git push origin v1.0.0</text><text x="402" y="420" font-size="23" class="" text-anchor="start">共有するタグを明示して送信する。</text></svg>
