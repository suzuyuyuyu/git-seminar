<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 594" role="img" aria-labelledby="title desc"><title id="title">bisect：書式・説明・オプション</title><desc id="desc">git bisect start。正常な版と不具合のある版の間を二分探索し、原因候補を絞る。。どの版でも同じ条件で確認できる、再現手順を用意する。。調査を始める。git bisect bad &lt;commit ID&gt;：不具合が出ると確認した版を指定する。。git bisect good &lt;commit ID&gt;：正常と確認した版を指定する。。途中の版に作業ファイルが切り替わる。作業中の変更は先に保存する。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git bisect start</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">正常な版と不具合のある版の間を二分探索し、原因候補を絞る。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">どの版でも同じ条件で確認できる、再現手順を用意する。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">調査を始める</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">git bisect bad &lt;commit</text><text x="47" y="334" font-size="23" class="mono" text-anchor="start">ID&gt;</text><text x="402" y="300" font-size="23" class="" text-anchor="start">不具合が出ると確認した版を指定する。</text><rect x="35" y="369" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="394" font-size="23" class="mono" text-anchor="start">git bisect good &lt;commit</text><text x="47" y="428" font-size="23" class="mono" text-anchor="start"> ID&gt;</text><text x="402" y="394" font-size="23" class="" text-anchor="start">正常と確認した版を指定する。</text>
<text x="40" y="506" font-size="21" class="muted" text-anchor="start">途中の版に作業ファイルが切り替わる。作業中の変更は先に保存する。</text></svg>
