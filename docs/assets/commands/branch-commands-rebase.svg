<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">rebase：書式・説明・オプション</title><desc id="desc">git rebase &lt;branch&gt;。ブランチの変更を、指定した別の履歴の先端へ乗せ直す。。mergeは元の履歴をつなぐ。rebaseは適用し直して履歴を1本につなぐ。。mainで比較する例。未共有の練習用履歴だけで扱う。2つの操作は代替案。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git rebase &lt;branch&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">ブランチの変更を、指定した別の履歴の先端へ乗せ直す。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">mergeは元の履歴をつなぐ。rebaseは適用し直して履歴を1本につなぐ。</text>
<g transform="translate(0 230)"><text x="35" y="25" font-size="24" class="heading" text-anchor="start">共通の出発点</text><text x="390" y="25" font-size="24" class="heading" text-anchor="start">rebase 後</text><text x="780" y="25" font-size="24" class="heading" text-anchor="start">merge 後</text><path d="M40 180H245 M90 180L125 130H240" class="history"/><circle cx="40" cy="180" r="8" fill="#30a46c"/><circle cx="90" cy="180" r="8" fill="#30a46c"/><circle cx="165" cy="180" r="8" fill="#30a46c"/><circle cx="240" cy="180" r="8" fill="#30a46c"/><circle cx="125" cy="130" r="8" fill="#e54d2e"/><circle cx="180" cy="130" r="8" fill="#e54d2e"/><circle cx="235" cy="130" r="8" fill="#e54d2e"/><rect x="226" y="166" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><rect x="221" y="116" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><text x="250" y="185" font-size="20" class="" text-anchor="start">main</text><text x="195" y="107" font-size="20" class="" text-anchor="start">feat/popup</text><path d="M340 180H385L420 130H660" class="history"/><circle cx="340" cy="180" r="8" fill="#30a46c"/><circle cx="385" cy="180" r="8" fill="#30a46c"/><circle cx="420" cy="130" r="8" fill="#e54d2e"/><circle cx="470" cy="130" r="8" fill="#e54d2e"/><circle cx="520" cy="130" r="8" fill="#e54d2e"/><circle cx="590" cy="130" r="8" fill="#30a46c"/><circle cx="655" cy="130" r="8" fill="#30a46c"/><rect x="506" y="116" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><rect x="641" y="116" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><text x="478" y="107" font-size="20" class="" text-anchor="start">feat/popup</text><text x="636" y="80" font-size="20" class="" text-anchor="start">main</text><path d="M745 180H1045 M795 180L830 130H925L1045 180" class="history"/><circle cx="745" cy="180" r="8" fill="#30a46c"/><circle cx="795" cy="180" r="8" fill="#30a46c"/><circle cx="865" cy="180" r="8" fill="#30a46c"/><circle cx="935" cy="180" r="8" fill="#30a46c"/><circle cx="1045" cy="180" r="8" fill="#30a46c"/><circle cx="830" cy="130" r="8" fill="#e54d2e"/><circle cx="875" cy="130" r="8" fill="#e54d2e"/><circle cx="925" cy="130" r="8" fill="#e54d2e"/><rect x="911" y="116" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><rect x="1031" y="166" width="28" height="28" rx="5" fill="none" stroke="#0d74ce" stroke-width="2.5"/><text x="875" y="107" font-size="20" class="" text-anchor="start">feat/popup</text><text x="1040" y="216" font-size="20" class="" text-anchor="start">main</text><text x="390" y="252" font-size="22" class="" text-anchor="start">main で実行</text><text x="390" y="286" font-size="22" class="mono" text-anchor="start">git rebase feat/popup</text><text x="390" y="323" font-size="21" class="" text-anchor="start">元となるcommit（base）を変える</text><text x="750" y="252" font-size="22" class="" text-anchor="start">同じ出発点の main で実行</text><text x="750" y="286" font-size="22" class="mono" text-anchor="start">git merge feat/popup</text><text x="750" y="323" font-size="21" class="" text-anchor="start">feat/popup を HEAD に統合する</text></g>
<text x="40" y="632" font-size="21" class="muted" text-anchor="start">mainで比較する例。未共有の練習用履歴だけで扱う。2つの操作は代替案。</text></svg>
