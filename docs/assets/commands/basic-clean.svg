<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 526" role="img" aria-labelledby="title desc"><title id="title">clean：書式・説明・オプション</title><desc id="desc">git clean &lt;options&gt;。untracked（未追跡）ファイルを削除する。。git reset --hard HEAD で通常は消えない未追跡ファイルが対象。。Options。-f / --force：実際に削除する。既定の設定では、この指定が必要。。-n / --dry-run：実際には削除せず、削除される候補だけを表示する。。履歴にないデータは削除後にGitから復元できない。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git clean &lt;options&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">untracked（未追跡）ファイルを削除する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">git reset --hard HEAD で通常は消えない未追跡ファイルが対象。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">-f / --force</text><text x="402" y="300" font-size="23" class="" text-anchor="start">実際に削除する。既定の設定では、この指定が必要。</text><rect x="35" y="335" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="360" font-size="23" class="mono" text-anchor="start">-n / --dry-run</text><text x="402" y="360" font-size="23" class="" text-anchor="start">実際には削除せず、削除される候補だけを表示する。</text>
<text x="40" y="438" font-size="21" class="muted" text-anchor="start">履歴にないデータは削除後にGitから復元できない。</text></svg>
