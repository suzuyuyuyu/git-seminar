<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 556" role="img" aria-labelledby="title desc"><title id="title">remote / branch -vv：書式・説明・オプション</title><desc id="desc">git remote -v。git branch -vv。originは接続先の名前。upstreamは各ローカルブランチの追跡先。。確認と設定。remote -v：取得先と送信先のURLを表示する。。branch -vv：ブランチごとの追跡先と位置を表示する。。push -u origin &lt;branch&gt;：指定ブランチを送信し、追跡先も設定する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git remote -v</text>
<rect x="30" y="104" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="138" font-size="27" class="command" text-anchor="start">git branch -vv</text>
<text x="44" y="217" font-size="24" class="" text-anchor="start">originは接続先の名前。upstreamは各ローカルブランチの追跡先。</text>
<text x="35" y="265" font-size="25" class="heading" text-anchor="start">確認と設定</text><path d="M35 278h1030" stroke="#868e8b"/><rect x="35" y="301" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="326" font-size="23" class="mono" text-anchor="start">remote -v</text><text x="402" y="326" font-size="23" class="" text-anchor="start">取得先と送信先のURLを表示する。</text><rect x="35" y="361" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="386" font-size="23" class="mono" text-anchor="start">branch -vv</text><text x="402" y="386" font-size="23" class="" text-anchor="start">ブランチごとの追跡先と位置を表示する。</text><rect x="35" y="421" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="446" font-size="23" class="mono" text-anchor="start">push -u origin &lt;branch&gt;</text><text x="402" y="446" font-size="23" class="" text-anchor="start">指定ブランチを送信し、追跡先も設定する。</text></svg>
