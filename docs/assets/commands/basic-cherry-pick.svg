<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 518" role="img" aria-labelledby="title desc"><title id="title">cherry-pick：書式・説明・オプション</title><desc id="desc">git cherry-pick &lt;commit ID&gt;。特定のcommitの変更だけを部分的に取り込む。。ブランチのすべてのcommitをmergeする必要がないときに使う。。複数のcommitを指定して、順に適用することもできる。。Options / Args。--continue：競合を解消してaddした後、処理を続ける。。--abort：処理を中止して開始前の状態へ戻す。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git cherry-pick &lt;commit ID&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">特定のcommitの変更だけを部分的に取り込む。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">ブランチのすべてのcommitをmergeする必要がないときに使う。</text>
<text x="44" y="239" font-size="24" class="" text-anchor="start">複数のcommitを指定して、順に適用することもできる。</text>
<text x="35" y="287" font-size="25" class="heading" text-anchor="start">Options / Args</text><path d="M35 300h1030" stroke="#868e8b"/><rect x="35" y="323" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="348" font-size="23" class="mono" text-anchor="start">--continue</text><text x="402" y="348" font-size="23" class="" text-anchor="start">競合を解消してaddした後、処理を続ける。</text><rect x="35" y="383" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="408" font-size="23" class="mono" text-anchor="start">--abort</text><text x="402" y="408" font-size="23" class="" text-anchor="start">処理を中止して開始前の状態へ戻す。</text></svg>
