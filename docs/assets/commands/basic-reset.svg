<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 878" role="img" aria-labelledby="title desc"><title id="title">reset：書式・説明・オプション</title><desc id="desc">git reset &lt;option&gt; &lt;commit ID&gt;。git reset &lt;commit ID&gt; -- &lt;file path&gt;。commit指定：現在のブランチの先端を指定したcommitへ移す。。&lt;commit ID&gt; はハッシュ値やHEADからの相対位置で指定する。。Options：commitを指定する形式。--hard：先端・index・working treeを指定commitへ合わせる。未commitの変更を破棄する。。--mixed：既定の動作。先端とindexを戻し、working treeの変更は残す。。--soft：先端だけを戻し、indexとworking treeの変更は残す。。パスを指定する形式。&lt;commit ID&gt; -- &lt;file path&gt;：そのファイルのindexを指定commitへ戻す。working treeやブランチの位置は変えない。。パス指定で復元するのはindex。作業ファイルの復元はrestoreを使う。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git reset &lt;option&gt; &lt;commit ID&gt;</text>
<rect x="30" y="104" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="138" font-size="27" class="command" text-anchor="start">git reset &lt;commit ID&gt; -- &lt;file path&gt;</text>
<text x="44" y="217" font-size="24" class="" text-anchor="start">commit指定：現在のブランチの先端を指定したcommitへ移す。</text>
<text x="44" y="265" font-size="24" class="" text-anchor="start">&lt;commit ID&gt; はハッシュ値やHEADからの相対位置で指定する。</text>
<text x="35" y="313" font-size="25" class="heading" text-anchor="start">Options：commitを指定する形式</text><path d="M35 326h1030" stroke="#868e8b"/><rect x="35" y="349" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="374" font-size="23" class="mono" text-anchor="start">--hard</text><text x="402" y="374" font-size="23" class="" text-anchor="start">先端・index・working treeを指定commitへ合わせる。未</text><text x="402" y="408" font-size="23" class="" text-anchor="start">commitの変更を破棄する。</text><rect x="35" y="443" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="468" font-size="23" class="mono" text-anchor="start">--mixed</text><text x="402" y="468" font-size="23" class="" text-anchor="start">既定の動作。先端とindexを戻し、working treeの変更は残</text><text x="402" y="502" font-size="23" class="" text-anchor="start">す。</text><rect x="35" y="537" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="562" font-size="23" class="mono" text-anchor="start">--soft</text><text x="402" y="562" font-size="23" class="" text-anchor="start">先端だけを戻し、indexとworking treeの変更は残す。</text>
<text x="35" y="617" font-size="25" class="heading" text-anchor="start">パスを指定する形式</text><path d="M35 630h1030" stroke="#868e8b"/><rect x="35" y="653" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="678" font-size="23" class="mono" text-anchor="start">&lt;commit ID&gt; -- &lt;file</text><text x="47" y="712" font-size="23" class="mono" text-anchor="start">path&gt;</text><text x="402" y="678" font-size="23" class="" text-anchor="start">そのファイルのindexを指定commitへ戻す。working treeや</text><text x="402" y="712" font-size="23" class="" text-anchor="start">ブランチの位置は変えない。</text>
<text x="40" y="790" font-size="21" class="muted" text-anchor="start">パス指定で復元するのはindex。作業ファイルの復元はrestoreを使う。</text></svg>
