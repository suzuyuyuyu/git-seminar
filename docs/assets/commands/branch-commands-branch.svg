<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 638" role="img" aria-labelledby="title desc"><title id="title">branch：書式・説明・オプション</title><desc id="desc">git branch &lt;branch name&gt; &lt;option&gt;。ブランチを管理する。引数もオプションもなければ一覧を表示する。。名前だけ指定すると、そのブランチを作成する。作業先は切り替えない。。ブランチの作成は、commitに新しく目印を付ける操作。。Options。-a / --all：ローカルとリモート追跡のブランチを、すべて一覧表示する。。-r / --remotes：リモート追跡ブランチだけを表示する。。-d / --delete：統合済みか確認してローカルブランチを削除する。。-u &lt;upstream&gt;：ローカルブランチの追跡先（upstream）を設定する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git branch &lt;branch name&gt; &lt;option&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">ブランチを管理する。引数もオプションもなければ一覧を表示する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">名前だけ指定すると、そのブランチを作成する。作業先は切り替えない。</text>
<text x="44" y="239" font-size="24" class="" text-anchor="start">ブランチの作成は、commitに新しく目印を付ける操作。</text>
<text x="35" y="287" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 300h1030" stroke="#868e8b"/><rect x="35" y="323" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="348" font-size="23" class="mono" text-anchor="start">-a / --all</text><text x="402" y="348" font-size="23" class="" text-anchor="start">ローカルとリモート追跡のブランチを、すべて一覧表示する。</text><rect x="35" y="383" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="408" font-size="23" class="mono" text-anchor="start">-r / --remotes</text><text x="402" y="408" font-size="23" class="" text-anchor="start">リモート追跡ブランチだけを表示する。</text><rect x="35" y="443" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="468" font-size="23" class="mono" text-anchor="start">-d / --delete</text><text x="402" y="468" font-size="23" class="" text-anchor="start">統合済みか確認してローカルブランチを削除する。</text><rect x="35" y="503" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="528" font-size="23" class="mono" text-anchor="start">-u &lt;upstream&gt;</text><text x="402" y="528" font-size="23" class="" text-anchor="start">ローカルブランチの追跡先（upstream）を設定する。</text></svg>
