<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 581" role="img" aria-labelledby="title desc"><title id="title">init：書式・説明・オプション</title><desc id="desc">git init。Git管理をローカル側から開始する。.gitディレクトリが作成される。。.gitには履歴や参照などの管理情報が保存される。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git init</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">Git管理をローカル側から開始する。.gitディレクトリが作成される。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">.gitには履歴や参照などの管理情報が保存される。</text>
<rect x="30" y="231" width="1040" height="246" rx="5" fill="#f7f9f8"/>
<text x="58" y="267" font-size="24" class="mono" text-anchor="start">$ ls -A</text><text x="58" y="303" font-size="24" class="mono" text-anchor="start">README.md  graph.py</text><text x="58" y="339" font-size="24" class="mono" text-anchor="start">$ git init</text><text x="58" y="375" font-size="24" class="mono" text-anchor="start">Initialized empty Git repository in /path/to/git-seminar/.git/</text><text x="58" y="411" font-size="24" class="mono" text-anchor="start">$ ls -A</text><text x="58" y="447" font-size="24" class="mono" text-anchor="start">.git  README.md  graph.py</text></svg>
