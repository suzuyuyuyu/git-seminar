<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 733" role="img" aria-labelledby="title desc"><title id="title">add：書式・説明・オプション</title><desc id="desc">git add &lt;file path&gt;。&lt;file path&gt; の内容をindexに反映する。。git add . でカレントディレクトリ以下を追加する。。git add ./*.py で該当するPythonファイルを追加する。。Options。-A / --all：すべての変更をaddする。未追跡・変更・削除を含む。。-u / --update：追跡済みファイルの変更・削除をaddする。。-p / --patch：変更箇所を部分的に選びながらaddする。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git add &lt;file path&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">&lt;file path&gt; の内容をindexに反映する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">git add . でカレントディレクトリ以下を追加する。</text>
<text x="44" y="239" font-size="24" class="" text-anchor="start">git add ./*.py で該当するPythonファイルを追加する。</text>
<g transform="translate(0 278)"><rect x="75" y="12" width="350" height="102" rx="6" fill="#f7f9f8"/><rect x="670" y="12" width="350" height="102" rx="6" fill="#f7f9f8"/><text x="250" y="46" font-size="24" class="heading" text-anchor="middle">working tree</text><text x="250" y="88" font-size="23" class="" text-anchor="middle">作業する場所：v2</text><text x="845" y="46" font-size="24" class="heading" text-anchor="middle">index</text><text x="845" y="88" font-size="23" class="" text-anchor="middle">記録候補：v1 から v2 へ</text><path d="M445 74H645" class="arrow" marker-end="url(#arrow)"/><text x="545" y="52" font-size="24" class="mono" text-anchor="middle">add</text></g>
<text x="35" y="442" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 455h1030" stroke="#868e8b"/><rect x="35" y="478" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="503" font-size="23" class="mono" text-anchor="start">-A / --all</text><text x="402" y="503" font-size="23" class="" text-anchor="start">すべての変更をaddする。未追跡・変更・削除を含む。</text><rect x="35" y="538" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="563" font-size="23" class="mono" text-anchor="start">-u / --update</text><text x="402" y="563" font-size="23" class="" text-anchor="start">追跡済みファイルの変更・削除をaddする。</text><rect x="35" y="598" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="623" font-size="23" class="mono" text-anchor="start">-p / --patch</text><text x="402" y="623" font-size="23" class="" text-anchor="start">変更箇所を部分的に選びながらaddする。</text></svg>
