<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 564" role="img" aria-labelledby="title desc"><title id="title">branch（commitの救出）：書式・説明・オプション</title><desc id="desc">git branch rescue/work &lt;commit ID&gt;。reflogなどで見つけたcommitを、ブランチ名から参照できるようにする。。commit IDやHEAD@{1}で候補を確認し、救出用の名前を付ける。。内容の確認と救出。git reflog：必要なcommitの候補を探す。。git show &lt;commit ID&gt;：内容を確認する。。git branch rescue/work &lt;commit ID&gt;：作業ファイルを切り替えず、commitに名前を付ける。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git branch rescue/work &lt;commit ID&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">reflogなどで見つけたcommitを、ブランチ名から参照できるようにする。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">commit IDやHEAD@{1}で候補を確認し、救出用の名前を付ける。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">内容の確認と救出</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">git reflog</text><text x="402" y="300" font-size="23" class="" text-anchor="start">必要なcommitの候補を探す。</text><rect x="35" y="335" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="360" font-size="23" class="mono" text-anchor="start">git show &lt;commit ID&gt;</text><text x="402" y="360" font-size="23" class="" text-anchor="start">内容を確認する。</text><rect x="35" y="395" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="420" font-size="23" class="mono" text-anchor="start">git branch rescue/work</text><text x="47" y="454" font-size="23" class="mono" text-anchor="start">&lt;commit ID&gt;</text><text x="402" y="420" font-size="23" class="" text-anchor="start">作業ファイルを切り替えず、commitに名前を付ける。</text></svg>
