<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 972" role="img" aria-labelledby="title desc"><title id="title">status：書式・説明・オプション</title><desc id="desc">git status。working tree / index / local branch の状態を表示する。。例：On branch main / Your branch is up to date with origin/main.。ブランチの情報。up to date：手元の追跡先と同じ位置にある。。behind：追跡先の方が進んでいる。。ahead：ローカルの方が進んでいる。。変更のある領域。Changes not staged for commit：working treeに、まだindexへ反映していない変更がある。。Changes to be committed：indexに変更が反映され、commitを待っている。。ファイルの状態。Untracked / new file：未追跡の新規ファイル / add済みの新規ファイル。。modified / deleted：変更されたファイル / 削除されたファイル。。リモートの最新状態への問い合わせは行わない。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git status</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">working tree / index / local branch の状態を表示する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">例：On branch main / Your branch is up to date with origin/main.</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">ブランチの情報</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">up to date</text><text x="402" y="300" font-size="23" class="" text-anchor="start">手元の追跡先と同じ位置にある。</text><rect x="35" y="335" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="360" font-size="23" class="mono" text-anchor="start">behind</text><text x="402" y="360" font-size="23" class="" text-anchor="start">追跡先の方が進んでいる。</text><rect x="35" y="395" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="420" font-size="23" class="mono" text-anchor="start">ahead</text><text x="402" y="420" font-size="23" class="" text-anchor="start">ローカルの方が進んでいる。</text>
<text x="35" y="475" font-size="25" class="heading" text-anchor="start">変更のある領域</text><path d="M35 488h1030" stroke="#868e8b"/><rect x="35" y="511" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="536" font-size="23" class="mono" text-anchor="start">Changes not staged for</text><text x="47" y="570" font-size="23" class="mono" text-anchor="start">commit</text><text x="402" y="536" font-size="23" class="" text-anchor="start">working treeに、まだindexへ反映していない変更がある。</text><rect x="35" y="605" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="630" font-size="23" class="mono" text-anchor="start">Changes to be committed</text><text x="402" y="630" font-size="23" class="" text-anchor="start">indexに変更が反映され、commitを待っている。</text>
<text x="35" y="685" font-size="25" class="heading" text-anchor="start">ファイルの状態</text><path d="M35 698h1030" stroke="#868e8b"/><rect x="35" y="721" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="746" font-size="23" class="mono" text-anchor="start">Untracked / new file</text><text x="402" y="746" font-size="23" class="" text-anchor="start">未追跡の新規ファイル / add済みの新規ファイル。</text><rect x="35" y="781" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="806" font-size="23" class="mono" text-anchor="start">modified / deleted</text><text x="402" y="806" font-size="23" class="" text-anchor="start">変更されたファイル / 削除されたファイル。</text>
<text x="40" y="884" font-size="21" class="muted" text-anchor="start">リモートの最新状態への問い合わせは行わない。</text></svg>
