<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 542" role="img" aria-labelledby="title desc"><title id="title">log：書式・説明・オプション</title><desc id="desc">git log [options]。記録済みcommitの説明と、親子関係を表示する。未commitの編集は含まない。。Options。--oneline：1件のcommitを、短いIDと説明の1行で表示する。。--graph：commitの親子関係を線で表示する。。--decorate：ブランチやタグなどの参照名を表示する。。--all：各参照からたどれる履歴をまとめて表示する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git log [options]</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">記録済みcommitの説明と、親子関係を表示する。未commitの編集は含まない。</text>
<text x="35" y="191" font-size="25" class="heading" text-anchor="start">Options</text><path d="M35 204h1030" stroke="#868e8b"/><rect x="35" y="227" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="252" font-size="23" class="mono" text-anchor="start">--oneline</text><text x="402" y="252" font-size="23" class="" text-anchor="start">1件のcommitを、短いIDと説明の1行で表示する。</text><rect x="35" y="287" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="312" font-size="23" class="mono" text-anchor="start">--graph</text><text x="402" y="312" font-size="23" class="" text-anchor="start">commitの親子関係を線で表示する。</text><rect x="35" y="347" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="372" font-size="23" class="mono" text-anchor="start">--decorate</text><text x="402" y="372" font-size="23" class="" text-anchor="start">ブランチやタグなどの参照名を表示する。</text><rect x="35" y="407" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="432" font-size="23" class="mono" text-anchor="start">--all</text><text x="402" y="432" font-size="23" class="" text-anchor="start">各参照からたどれる履歴をまとめて表示する。</text></svg>
