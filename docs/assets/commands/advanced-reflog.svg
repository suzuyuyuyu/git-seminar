<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">reflog：書式・説明・オプション</title><desc id="desc">git reflog。HEADやブランチなどの参照が、このリポジトリで動いた記録を表示する。。HEAD@{1}は、HEADの直前の記録を参照する指定。。参照の移動を調べる。git reflog：移動前のcommit IDと操作を探す。。git show 'HEAD@{1}'：候補のcommitの内容を確認する。。git branch rescue &lt;commit ID&gt;：必要なcommitに救出用の名前を付ける。。記録には期限がある。未commitの編集を保存する仕組みではない。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git reflog</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">HEADやブランチなどの参照が、このリポジトリで動いた記録を表示する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">HEAD@{1}は、HEADの直前の記録を参照する指定。</text>
<text x="35" y="239" font-size="25" class="heading" text-anchor="start">参照の移動を調べる</text><path d="M35 252h1030" stroke="#868e8b"/><rect x="35" y="275" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="300" font-size="23" class="mono" text-anchor="start">git reflog</text><text x="402" y="300" font-size="23" class="" text-anchor="start">移動前のcommit IDと操作を探す。</text><rect x="35" y="335" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="360" font-size="23" class="mono" text-anchor="start">git show 'HEAD@{1}'</text><text x="402" y="360" font-size="23" class="" text-anchor="start">候補のcommitの内容を確認する。</text><rect x="35" y="395" width="345" height="81" rx="4" fill="#f7f9f8"/><text x="47" y="420" font-size="23" class="mono" text-anchor="start">git branch rescue</text><text x="47" y="454" font-size="23" class="mono" text-anchor="start">&lt;commit ID&gt;</text><text x="402" y="420" font-size="23" class="" text-anchor="start">必要なcommitに救出用の名前を付ける。</text>
<text x="40" y="532" font-size="21" class="muted" text-anchor="start">記録には期限がある。未commitの編集を保存する仕組みではない。</text></svg>
