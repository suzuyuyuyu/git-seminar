<svg xmlns="http://www.w3.org/2000/svg" class="command-reference" viewBox="0 0 1100 706" role="img" aria-labelledby="title desc"><title id="title">merge：書式・説明・オプション</title><desc id="desc">git merge &lt;branch&gt; &lt;option&gt;。&lt;branch&gt; の履歴をHEAD（現在のブランチ）へ統合する。。分岐した履歴の統合では、通常はmerge commitを作成する。。変更内容によってはconflictが発生する。。Options / Args。-m &quot;message&quot;：作成するmerge commitのメッセージを指定する。。--squash：統合結果をindex・working treeへ準備する。その後、別途commitして1つにまとめる。。--ff：可能ならfast-forwardで統合する。。--no-ff / --ff-only：merge commitを作成する / fast-forward可能な場合だけ統合する。。</desc><style>.command-reference {font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#1a211e;} .command-reference .heading {fill:#218358;font-weight:700;} .command-reference .mono,.command-reference .command {font-family:Consolas,monospace;} .command-reference .command {fill:#fff;} .command-reference .muted {fill:#5f6563;} .command-reference .arrow {fill:none;stroke:#218358;stroke-width:3;} .command-reference .history {fill:none;stroke:#868e8b;stroke-width:3;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218358"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0090ff"/></marker><marker id="warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e54d2e"/></marker></defs><rect x="30" y="30" width="1040" height="62" rx="5" fill="#1a211e"/>
<text x="50" y="64" font-size="27" class="command" text-anchor="start">git merge &lt;branch&gt; &lt;option&gt;</text>
<text x="44" y="143" font-size="24" class="" text-anchor="start">&lt;branch&gt; の履歴をHEAD（現在のブランチ）へ統合する。</text>
<text x="44" y="191" font-size="24" class="" text-anchor="start">分岐した履歴の統合では、通常はmerge commitを作成する。</text>
<text x="44" y="239" font-size="24" class="" text-anchor="start">変更内容によってはconflictが発生する。</text>
<text x="35" y="287" font-size="25" class="heading" text-anchor="start">Options / Args</text><path d="M35 300h1030" stroke="#868e8b"/><rect x="35" y="323" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="348" font-size="23" class="mono" text-anchor="start">-m &quot;message&quot;</text><text x="402" y="348" font-size="23" class="" text-anchor="start">作成するmerge commitのメッセージを指定する。</text><rect x="35" y="383" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="408" font-size="23" class="mono" text-anchor="start">--squash</text><text x="402" y="408" font-size="23" class="" text-anchor="start">統合結果をindex・working treeへ準備する。その後、別途</text><text x="402" y="442" font-size="23" class="" text-anchor="start">commitして1つにまとめる。</text><rect x="35" y="477" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="502" font-size="23" class="mono" text-anchor="start">--ff</text><text x="402" y="502" font-size="23" class="" text-anchor="start">可能ならfast-forwardで統合する。</text><rect x="35" y="537" width="345" height="47" rx="4" fill="#f7f9f8"/><text x="47" y="562" font-size="23" class="mono" text-anchor="start">--no-ff / --ff-only</text><text x="402" y="562" font-size="23" class="" text-anchor="start">merge commitを作成する / fast-forward可能な場合だけ</text><text x="402" y="596" font-size="23" class="" text-anchor="start">統合する。</text></svg>
