<svg xmlns="http://www.w3.org/2000/svg" class="foundations-practice" viewBox="0 0 520 480" role="img" aria-labelledby="practice-title practice-desc" data-current-state="init"><title id="practice-title">自分のリポジトリで実践</title><desc id="practice-desc">新しい練習フォルダーから始め、ファイルの作成、記録、空の共有先への登録と送信を行い、最後に自分で繰り返します。</desc><defs><marker id="practice-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#218358"/></marker></defs><style><![CDATA[
svg.foundations-practice { background:#fbfdfc; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; color:#1a211e;
[data-state] { display:none; }
&[data-current-state="init"] [data-state="init"] { display:block; }
&[data-current-state="edit"] [data-state="edit"] { display:block; }
&[data-current-state="record"] [data-state="record"] { display:block; }
&[data-current-state="remote"] [data-state="remote"] { display:block; }
&[data-current-state="publish"] [data-state="publish"] { display:block; }
&[data-current-state="exercise"] [data-state="exercise"] { display:block; }
text { fill:#1a211e; font-size:22px; }
.heading { font-size:26px; font-weight:700; }
.label { fill:#218358; font-weight:600; }
.center { text-anchor:middle; }
.box { fill:#f7f9f8; stroke:#cbcfcd; stroke-width:2; }
.accent { fill:#e6f6eb; stroke:#218358; stroke-width:3; }
.arrow { fill:none; stroke:#218358; stroke-width:3; marker-end:url(#practice-arrow); }
}
]]></style><g data-state="init"><text x="36" y="48" class="heading">新しい練習場所から始める</text><rect x="44" y="84" width="432" height="226" rx="14" class="accent"/><text x="62" y="120" class="">git-seminar-practice/</text><text x="62" y="152" class="">  .git/ → 管理情報</text><text x="62" y="184" class="">  main → まだcommitなし</text><text x="62" y="216" class="">git init -b main</text><text x="44" y="388" class="">既存リポジトリの外で作成</text></g><g data-state="edit"><text x="36" y="48" class="heading">エディターで保存する</text><rect x="44" y="90" width="432" height="180" rx="14" class="accent"/><text x="62" y="126" class="">hello.py</text><text x="62" y="158" class="">print("Hello, world!")</text><text x="62" y="190" class="">状態：Untracked</text><text x="44" y="350" class="">保存できたかstatusで確認</text><text x="44" y="390" class="">まだ履歴には記録されていない</text></g><g data-state="record"><text x="36" y="48" class="heading">準備してから記録する</text><rect x="70" y="76" width="380" height="72" rx="14" class="box"/><text x="88" y="112" class="">hello.py</text><path d="M100 148 L100 214" class="arrow"/><text x="118" y="187" class="label">add</text><rect x="70" y="228" width="380" height="72" rx="14" class="box"/><text x="88" y="264" class="">index</text><path d="M100 300 L100 366" class="arrow"/><text x="118" y="339" class="label">commit</text><rect x="70" y="380" width="380" height="72" rx="14" class="accent"/><text x="88" y="416" class="">c1：Initial greeting</text></g><g data-state="remote"><text x="36" y="48" class="heading">空の共有先に名前を付ける</text><rect x="46" y="82" width="428" height="104" rx="14" class="box"/><text x="64" y="118" class="">手元のリポジトリ</text><text x="64" y="150" class="">main → c1</text><path d="M120 186 L120 258" class="arrow"/><text x="138" y="228" class="label">originという接続先</text><rect x="46" y="272" width="428" height="104" rx="14" class="accent"/><text x="64" y="308" class="">自分のGitHubリポジトリ</text><text x="64" y="340" class="">まだ空の状態</text><text x="46" y="430" class="">remote addだけでは送信しない</text></g><g data-state="publish"><text x="36" y="48" class="heading">記録した履歴を送る</text><rect x="46" y="82" width="428" height="104" rx="14" class="box"/><text x="64" y="118" class="">手元のmain → c1</text><path d="M120 186 L120 258" class="arrow"/><text x="138" y="228" class="label">push -u origin main</text><rect x="46" y="272" width="428" height="104" rx="14" class="accent"/><text x="64" y="308" class="">GitHubのmain → c1</text><text x="64" y="340" class="">hello.pyとcommitを確認</text><text x="46" y="430" class="">追跡先も関連付ける</text></g><g data-state="exercise"><text x="36" y="48" class="heading">もう一度、自分で記録する</text><circle cx="118" cy="130" r="25" class="box"/><text x="118" y="138" class="center">c1</text><path d="M144 130 L320 130" class="arrow"/><circle cx="350" cy="130" r="25" class="accent"/><text x="350" y="138" class="center">c2</text><text x="58" y="204" class="">Hello, world! → everyone!</text><rect x="48" y="254" width="424" height="132" rx="14" class="accent"/><text x="66" y="290" class="">保存 → add → commit</text><text x="66" y="322" class="">push → GitHubで確認</text><text x="66" y="354" class="">履歴が2件あれば完了</text></g></svg>