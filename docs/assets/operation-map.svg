<svg xmlns="http://www.w3.org/2000/svg" class="operation-map" viewBox="0 0 1100 860" role="img" aria-labelledby="map-title map-desc" data-current-state="overview">
  <title id="map-title">リモートから作業ツリーまでの全体図</title>
  <desc id="map-desc">原資料22・42ページの領域と操作の対応を再現。リモートにrepo Aとそのforkであるrepo Bを置き、手元にはリモート追跡ブランチ、ローカルブランチ、index、working tree、stashを分けます。clone、fetch、merge、pull、push、commit、add、stashとapplyがどの領域を更新するかを示します。</desc>
  <style><![CDATA[
    svg.operation-map {
      background:#fbfcf9;font-family:"Yu Gothic",Meiryo,sans-serif;
      text {font-size:25px;fill:#24352e;}
      .heading {font-weight:700;}
      .small {font-size:23px;}
      .lane {stroke:#63756a;stroke-width:3;}
      .point {fill:#8b9cbe;}
      .flow path,.flow line {stroke:#a1aaa3;stroke-width:5;fill:none;marker-end:url(#map-arrow);}
      .flow rect {fill:#eef1e9;stroke:#c9d1c8;}
      .flow text {font-family:Consolas,monospace;font-size:25px;}
      &[data-current-state="clone"] [data-flow="clone"],
      &[data-current-state="fetch"] [data-flow="fetch"],
      &[data-current-state="pull"] [data-flow="fetch"],
      &[data-current-state="pull"] [data-flow="merge"],
      &[data-current-state="fork"] [data-flow="fork"],
      &[data-current-state="stash"] [data-flow="stash"],
      &[data-current-state="overview"] .flow {
        & path,& line {stroke:#31664b;}
        & rect {fill:#f5eac8;}
      }
    }
  ]]></style>
  <defs><marker id="map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="#63756a"/></marker></defs>
  <g data-state="overview">
    <text class="heading" x="20" y="35">リモートのリポジトリ</text>
    <a href="https://github.com/" target="_blank"><image href="illustrations/github-wordmark.svg" x="350" y="8" width="120" height="36"/></a>
    <text class="small" x="500" y="35">GitHub / GitLabなどの共有先</text>
    <rect x="10" y="65" width="1080" height="260" rx="18" fill="#dcefe0"/>
    <rect x="220" y="88" width="850" height="118" rx="10" fill="#fff"/>
    <rect x="220" y="252" width="850" height="56" rx="10" fill="#fff"/>
    <text class="heading" x="35" y="135">repo A</text><text class="heading" x="35" y="289">repo B</text>
    <image href="illustrations/cloud.svg" x="65" y="163" width="80" height="70"/>
    <path class="lane" d="M245 125H1015M245 178H1015M245 280H1015"/>
    <circle class="point" cx="1015" cy="125" r="9"/><circle class="point" cx="1015" cy="178" r="9"/><circle class="point" cx="1015" cy="280" r="9"/>
    <text class="small" x="957" y="111">main</text><text class="small" x="925" y="164">develop</text><text class="small" x="957" y="266">main</text>
    <text class="heading" x="20" y="365">ローカルのリポジトリと作業領域</text><image href="illustrations/computer.svg" x="660" y="336" width="66" height="39"/>
    <rect x="10" y="388" width="1080" height="425" rx="18" fill="#f5e3de"/>
    <rect x="220" y="405" width="850" height="385" rx="10" fill="#fff"/>
    <text class="small" x="30" y="442">remote tracking</text><text class="small" x="30" y="470">branch</text>
    <text class="small" x="30" y="540">local branch</text><text x="30" y="630">index</text><text x="30" y="714">working tree</text><text x="30" y="790">stash</text>
    <path class="lane" d="M245 445H1015M245 535H1015M245 625H1015M245 710H1015M245 785H1015"/>
    <circle class="point" cx="1015" cy="445" r="9"/><circle class="point" cx="1015" cy="535" r="9"/>
    <text class="small" x="903" y="431">origin/main</text><text class="small" x="957" y="521">main</text>
    <g class="flow" data-flow="fork"><path d="M390 207V245"/><rect x="423" y="211" width="100" height="37" rx="5"/><text x="473" y="239" text-anchor="middle">fork</text></g>
    <g class="flow" data-flow="clone"><path d="M310 313V702"/><rect x="335" y="475" width="111" height="37" rx="5"/><text x="390" y="503" text-anchor="middle">clone</text></g>
    <g class="flow" data-flow="fetch"><path d="M575 313V437"/><rect x="595" y="376" width="110" height="37" rx="5"/><text x="650" y="404" text-anchor="middle">fetch</text></g>
    <g class="flow" data-flow="merge"><path d="M575 454V527"/><rect x="596" y="474" width="110" height="37" rx="5"/><text x="651" y="502" text-anchor="middle">merge</text></g>
    <path d="M733 317H750V528H733" fill="none" stroke="#8b9cbe" stroke-width="3"/><text x="775" y="428" class="small">pull</text>
    <g class="flow" data-flow="push"><path d="M913 526V317"/><rect x="936" y="363" width="100" height="37" rx="5"/><text x="986" y="391" text-anchor="middle">push</text></g>
    <g class="flow" data-flow="commit"><path d="M913 616V547"/><rect x="741" y="572" width="132" height="37" rx="5"/><text x="807" y="600" text-anchor="middle">commit</text></g>
    <g class="flow" data-flow="add"><path d="M913 701V636"/><rect x="778" y="653" width="95" height="37" rx="5"/><text x="825" y="681" text-anchor="middle">add</text></g>
    <g class="flow" data-flow="stash"><path d="M470 720V775M665 775V720"/><rect x="358" y="735" width="102" height="37" rx="5"/><text x="409" y="763" text-anchor="middle">stash</text><rect x="682" y="735" width="190" height="37" rx="5"/><text x="777" y="763" text-anchor="middle">stash apply</text></g>
    <text class="small" x="800" y="73">PR / MRで統合を提案</text>
    <text class="small" x="20" y="849">pullは取得と統合。forkは共有先側の複製、cloneは手元への複製です。</text>
  </g>
  <g data-state="clone"><rect x="0" y="0" width="1100" height="860" fill="none" opacity="0"/></g>
  <g data-state="fetch"><rect x="0" y="0" width="1100" height="860" fill="none" opacity="0"/></g>
  <g data-state="pull"><rect x="0" y="0" width="1100" height="860" fill="none" opacity="0"/></g>
  <g data-state="fork"><rect x="0" y="0" width="1100" height="860" fill="none" opacity="0"/></g>
  <g data-state="stash"><rect x="0" y="0" width="1100" height="860" fill="none" opacity="0"/></g>
</svg>
