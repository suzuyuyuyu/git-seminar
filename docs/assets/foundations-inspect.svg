<svg xmlns="http://www.w3.org/2000/svg" class="foundations-inspect" viewBox="0 0 520 480" role="img" aria-labelledby="inspect-title inspect-desc" data-current-state="clone"><title id="inspect-title">状態の確認と履歴の取得</title><desc id="inspect-desc">status、diff、logは異なる情報を確認します。fetchはリモート追跡情報を更新し、pullは取得した履歴を現在のブランチへ統合します。</desc><defs><marker id="inspect-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2c7165"/></marker></defs><style><![CDATA[
svg.foundations-inspect { background:#fbfcf9; font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif; color:#23382f;
[data-state] { display:none; }
&[data-current-state="clone"] [data-state="clone"] { display:block; }
&[data-current-state="status"] [data-state="status"] { display:block; }
&[data-current-state="diff"] [data-state="diff"] { display:block; }
&[data-current-state="log"] [data-state="log"] { display:block; }
&[data-current-state="fetch"] [data-state="fetch"] { display:block; }
&[data-current-state="pull"] [data-state="pull"] { display:block; }
text { fill:#23382f; font-size:22px; }
.heading { font-size:26px; font-weight:700; }
.label { fill:#376f61; font-weight:600; }
.center { text-anchor:middle; }
.box { fill:#f1f4ee; stroke:#b9cbbd; stroke-width:2; }
.accent { fill:#e2f0e8; stroke:#2c7165; stroke-width:3; }
.arrow { fill:none; stroke:#2c7165; stroke-width:3; marker-end:url(#inspect-arrow); }
}
]]></style><g data-state="clone"><text x="36" y="48" class="heading">既存の履歴を複製する</text><rect x="62" y="84" width="396" height="104" rx="14" class="box"/><text x="80" y="120" class="">リモートリポジトリ</text><text x="80" y="152" class="">ファイルとcommitの履歴</text><path d="M260 188 L260 260" class="arrow"/><text x="278" y="230" class="label">clone</text><rect x="62" y="274" width="396" height="104" rx="14" class="accent"/><text x="80" y="310" class="">新しい作業フォルダー</text><text x="80" y="342" class="">ローカルの履歴とファイル</text></g><g data-state="status"><text x="36" y="48" class="heading">status：今の状態</text><rect x="58" y="82" width="404" height="100" rx="14" class="accent"/><text x="76" y="118" class="">working tree</text><text x="76" y="150" class="">未追跡・未ステージの変更</text><rect x="58" y="210" width="404" height="100" rx="14" class="box"/><text x="76" y="246" class="">index</text><text x="76" y="278" class="">次のcommitの準備</text><rect x="58" y="338" width="404" height="78" rx="14" class="box"/><text x="76" y="374" class="">現在のbranchと追跡先</text></g><g data-state="diff"><text x="36" y="48" class="heading">diff：比較する場所</text><rect x="44" y="76" width="432" height="72" rx="14" class="box"/><text x="62" y="112" class="">working tree</text><path d="M92 148 L92 214" class="arrow"/><text x="110" y="187" class="label">diff</text><rect x="44" y="228" width="432" height="72" rx="14" class="accent"/><text x="62" y="264" class="">index</text><path d="M92 300 L92 366" class="arrow"/><text x="110" y="339" class="label">diff --staged</text><rect x="44" y="380" width="432" height="72" rx="14" class="box"/><text x="62" y="416" class="">現在のcommit</text></g><g data-state="log"><text x="36" y="48" class="heading">log：記録済みの履歴</text><circle cx="130" cy="130" r="25" class="accent"/><text x="130" y="138" class="center">c3</text><path d="M130 156 L130 211" class="arrow"/><circle cx="130" cy="240" r="25" class="box"/><text x="130" y="248" class="center">c2</text><path d="M130 266 L130 321" class="arrow"/><circle cx="130" cy="350" r="25" class="box"/><text x="130" y="358" class="center">c1</text><text x="196" y="138" class="">← main ← HEAD</text><text x="196" y="248" class="">線は親へのつながり</text><text x="58" y="426" class="">未commitの編集は並ばない</text></g><g data-state="fetch"><text x="36" y="48" class="heading">fetch：追跡情報を更新</text><rect x="48" y="76" width="424" height="88" rx="14" class="box"/><text x="66" y="112" class="">リモートmain → c3</text><path d="M126 164 L126 230" class="arrow"/><text x="144" y="203" class="label">fetch</text><rect x="48" y="244" width="424" height="88" rx="14" class="accent"/><text x="66" y="280" class="">手元のorigin/main → c3</text><rect x="48" y="360" width="424" height="88" rx="14" class="box"/><text x="66" y="396" class="">手元のmain → c2のまま</text><text x="66" y="428" class="">作業ファイルも変わらない</text></g><g data-state="pull"><text x="36" y="48" class="heading">pull --ff-only：進められる時だけ</text><rect x="48" y="76" width="424" height="88" rx="14" class="box"/><text x="66" y="112" class="">origin/main → c3</text><path d="M126 164 L126 230" class="arrow"/><text x="144" y="203" class="label">取得して統合</text><rect x="48" y="244" width="424" height="88" rx="14" class="accent"/><text x="66" y="280" class="">現在のmain → c3</text><rect x="48" y="360" width="424" height="88" rx="14" class="box"/><text x="66" y="396" class="">作業ファイルにも反映</text><text x="66" y="428" class="">履歴が分岐していたら拒否</text></g></svg>