<svg xmlns="http://www.w3.org/2000/svg" class="branch-model" viewBox="0 0 640 620" role="img" aria-labelledby="branch-model-title branch-model-desc" data-current-state="dotgit">
<title id="branch-model-title">Gitの管理構造とブランチの読み方</title>
<desc id="branch-model-desc">.gitと作業ファイルを分ける構造、commit作成前後の比較、ブランチを線全体と誤解した図と一つのcommitを指す正しい図の比較、commit・branch・HEADの整理を示します。比較図は左右で親子関係を揃えています。現在の節だけを表示します。</desc>
<style><![CDATA[svg.branch-model {
 background:#fbfcf9;font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
 text {font-size:22px;fill:#24352e;}
 .heading {font-size:26px;font-weight:700;}
 .strong {fill:#31664b;font-weight:700;}
 .red {fill:#a74238;font-weight:700;}
 .commit {fill:#6f9e78;stroke:#31664b;stroke-width:2;}
 .line {fill:none;stroke:#a2ada5;stroke-width:3;}
 .divider {fill:none;stroke:#d8dfd6;stroke-width:1.5;}
 .arrow {fill:none;stroke:#31664b;stroke-width:2.5;}
 .head-arrow {fill:none;stroke:#a74238;stroke-width:2;}
 .marker {fill:#dfe8e8;fill-opacity:.5;stroke:#31664b;stroke-width:2;}
 .box {fill:#edf3eb;stroke:#c4d3c5;stroke-width:2;}
 [data-state] {display:none;}
&[data-current-state="head"] [data-state="head"],
&[data-current-state="branch-growth"] [data-state="branch-growth"],
&[data-current-state="create"] [data-state="create"],
&[data-current-state="push-pr"] [data-state="push-pr"],
&[data-current-state="dotgit"] [data-state="dotgit"],
&[data-current-state="commit-change"] [data-state="commit-change"],
&[data-current-state="misconception"] [data-state="misconception"],
&[data-current-state="summary"] [data-state="summary"] {display:block;}
}]]></style>
<g data-state="dotgit"><text x="28" y="48" class="heading">.git：履歴と目印の管理情報</text><image x="32" y="80" width="76" height="76" href="illustrations/folder.svg"/><text x="132" y="125" class="strong">作業フォルダ</text><path class="line" d="M 70 164 V 305 M 70 205 H 132 M 70 285 H 132"/><image x="135" y="168" width="60" height="60" href="illustrations/folder.svg"/><text x="215" y="209" class="strong">.git</text><image x="143" y="250" width="48" height="48" href="illustrations/file.svg"/><text x="215" y="286" class="">README.md</text><path class="line" d="M 240 225 V 330 H 84 V 350"/><rect class="box" x="32" y="350" width="456" height="162" rx="12"/><text x="52" y="387" class="">commitの履歴・スナップショット</text><text x="52" y="425" class="">HEAD：現在地</text><text x="52" y="463" class="">branch：commitの目印</text><text x="52" y="500" class="">remote：共有先の情報</text></g>
<g data-state="commit-change"><text x="28" y="48" class="heading">add・commitの前後を比較</text><text x="42" y="104" class="strong">commit前</text><text x="300" y="104" class="strong">commit後</text><path class="line" d="M 100 420 V 260"/><circle class="commit" cx="100" cy="420" r="14"/><text x="52" y="428" class="">c1</text><circle class="commit" cx="100" cy="340" r="14"/><text x="52" y="348" class="">c2</text><circle class="commit" cx="100" cy="260" r="14"/><text x="52" y="268" class="">c3</text><rect class="marker" x="78" y="238" width="44" height="44" rx="5"/><text x="136" y="268" class="strong">main</text><text x="136" y="217" class="red">HEAD</text><path class="head-arrow" d="M 157 225 V 238"/><path class="line" d="M 340 420 V 180"/><circle class="commit" cx="340" cy="420" r="14"/><text x="292" y="428" class="">c1</text><circle class="commit" cx="340" cy="340" r="14"/><text x="292" y="348" class="">c2</text><circle class="commit" cx="340" cy="260" r="14"/><text x="292" y="268" class="">c3</text><circle class="commit" cx="340" cy="180" r="14"/><text x="292" y="188" class="">c4</text><rect class="marker" x="318" y="158" width="44" height="44" rx="5"/><text x="376" y="188" class="strong">main</text><text x="376" y="137" class="red">HEAD</text><path class="head-arrow" d="M 397 145 V 158"/><path class="arrow" d="M 205 320 H 273 m -10 -7 l 10 7 l -10 7"/><text x="38" y="479" class="">c4ができ、mainがc4を指す</text><text x="38" y="518" class="">HEADはmainを指したまま</text></g>
<g data-state="misconception"><text x="22" y="40" class="heading">誤解：線を包む</text><text x="340" y="40" class="heading">正：1commitだけ</text><path class="divider" d="M 320 65 V 600"/><text x="55" y="102" class="">main</text><text x="170" y="135" class="">branch</text><path class="line" d="M 85 280 V 145 M 85 235 L 210 220 V 175"/><rect class="marker" x="63" y="123" width="44" height="179" rx="5"/><rect class="marker" x="188" y="153" width="44" height="89" rx="5"/><circle class="commit" cx="85" cy="280" r="14"/><circle class="commit" cx="85" cy="235" r="14"/><circle class="commit" cx="85" cy="190" r="14"/><circle class="commit" cx="85" cy="145" r="14"/><circle class="commit" cx="210" cy="220" r="14"/><circle class="commit" cx="210" cy="175" r="14"/><text x="55" y="351" class="">main</text><text x="170" y="429" class="">branch</text><path class="line" d="M 85 570 V 390 M 85 525 L 210 515 V 470"/><path class="line" d="M 85 435 L 210 470"/><rect class="marker" x="63" y="368" width="44" height="224" rx="5"/><rect class="marker" x="188" y="448" width="44" height="89" rx="5"/><circle class="commit" cx="85" cy="570" r="14"/><circle class="commit" cx="85" cy="525" r="14"/><circle class="commit" cx="85" cy="480" r="14"/><circle class="commit" cx="85" cy="435" r="14"/><circle class="commit" cx="85" cy="390" r="14"/><circle class="commit" cx="210" cy="515" r="14"/><circle class="commit" cx="210" cy="470" r="14"/><text x="375" y="102" class="">main</text><text x="490" y="135" class="">branch</text><path class="line" d="M 405 280 V 145 M 405 235 L 530 220 V 175"/><rect class="marker" x="383" y="123" width="44" height="44" rx="5"/><rect class="marker" x="508" y="153" width="44" height="44" rx="5"/><circle class="commit" cx="405" cy="280" r="14"/><circle class="commit" cx="405" cy="235" r="14"/><circle class="commit" cx="405" cy="190" r="14"/><circle class="commit" cx="405" cy="145" r="14"/><circle class="commit" cx="530" cy="220" r="14"/><circle class="commit" cx="530" cy="175" r="14"/><text x="375" y="351" class="">main</text><text x="490" y="429" class="">branch</text><path class="line" d="M 405 570 V 390 M 405 525 L 530 515 V 470"/><path class="line" d="M 405 435 L 530 470"/><rect class="marker" x="383" y="368" width="44" height="44" rx="5"/><rect class="marker" x="508" y="448" width="44" height="44" rx="5"/><circle class="commit" cx="405" cy="570" r="14"/><circle class="commit" cx="405" cy="525" r="14"/><circle class="commit" cx="405" cy="480" r="14"/><circle class="commit" cx="405" cy="435" r="14"/><circle class="commit" cx="405" cy="390" r="14"/><circle class="commit" cx="530" cy="515" r="14"/><circle class="commit" cx="530" cy="470" r="14"/></g>
<g data-state="summary"><text x="28" y="48" class="heading">記録・目印・現在地を分ける</text><circle class="commit" cx="66" cy="126" r="14"/><text x="116" y="118" class="strong">commit</text><text x="116" y="157" class="">スナップショットと親の情報</text><circle class="commit" cx="66" cy="276" r="14"/><rect class="marker" x="44" y="254" width="44" height="44" rx="5"/><text x="116" y="269" class="strong">branch</text><text x="116" y="308" class="">一つのcommitを指す名前</text><text x="28" y="413" class="red">HEAD</text><path class="head-arrow" d="M 106 405 H 147 m -8 -6 l 8 6 l -8 6"/><text x="162" y="412" class="">main → commit</text><text x="116" y="457" class="">通常はbranchを介して現在地を示す</text><text x="32" y="537" class="">tag：自動では進まないcommitの目印</text></g>
<g data-state="head"><text x="28" y="40" class="heading">HEADの位置を比べる</text><path class="line" d="M 55 500 V 180"/><circle class="commit" cx="55" cy="500" r="13"/><circle class="commit" cx="55" cy="420" r="13"/><circle class="commit" cx="55" cy="340" r="13"/><circle class="commit" cx="55" cy="260" r="13"/><circle class="commit" cx="55" cy="180" r="13"/><rect class="marker" x="33" y="158" width="44" height="44" rx="5"/><text x="31" y="143" class="strong">main</text><text x="30" y="90" class="red">HEAD</text><path class="head-arrow" d="M 55 101 V 115 m -5 -6 l 5 6 l 5 -6"/><path class="line" d="M 175 500 V 180"/><circle class="commit" cx="175" cy="500" r="13"/><circle class="commit" cx="175" cy="420" r="13"/><circle class="commit" cx="175" cy="340" r="13"/><circle class="commit" cx="175" cy="260" r="13"/><circle class="commit" cx="175" cy="180" r="13"/><rect class="marker" x="153" y="158" width="44" height="44" rx="5"/><text x="151" y="143" class="strong">main</text><text x="195" y="233" class="red">HEAD</text><path class="head-arrow" d="M 213 240 L 192 258 m 2 -7 l -2 7 l 7 -1"/><path class="line" d="M 295 500 V 180"/><circle class="commit" cx="295" cy="500" r="13"/><circle class="commit" cx="295" cy="420" r="13"/><circle class="commit" cx="295" cy="340" r="13"/><circle class="commit" cx="295" cy="260" r="13"/><circle class="commit" cx="295" cy="180" r="13"/><rect class="marker" x="273" y="158" width="44" height="44" rx="5"/><text x="271" y="143" class="strong">main</text><text x="315" y="313" class="red">HEAD</text><path class="head-arrow" d="M 333 320 L 312 338 m 2 -7 l -2 7 l 7 -1"/><path class="line" d="M 415 500 V 180"/><circle class="commit" cx="415" cy="500" r="13"/><circle class="commit" cx="415" cy="420" r="13"/><circle class="commit" cx="415" cy="340" r="13"/><circle class="commit" cx="415" cy="260" r="13"/><circle class="commit" cx="415" cy="180" r="13"/><rect class="marker" x="393" y="158" width="44" height="44" rx="5"/><text x="391" y="143" class="strong">main</text><text x="435" y="393" class="red">HEAD</text><path class="head-arrow" d="M 453 400 L 432 418 m 2 -7 l -2 7 l 7 -1"/><path class="line" d="M 535 500 V 180"/><circle class="commit" cx="535" cy="500" r="13"/><circle class="commit" cx="535" cy="420" r="13"/><circle class="commit" cx="535" cy="340" r="13"/><circle class="commit" cx="535" cy="260" r="13"/><circle class="commit" cx="535" cy="180" r="13"/><rect class="marker" x="513" y="158" width="44" height="44" rx="5"/><text x="511" y="143" class="strong">main</text><text x="555" y="473" class="red">HEAD</text><path class="head-arrow" d="M 573 480 L 552 498 m 2 -7 l -2 7 l 7 -1"/><text x="28" y="552" class="">通常：branch経由</text><text x="280" y="552" class="">右4列：detached HEAD</text><text x="28" y="593" class="">mainを動かさず、過去のcommitを直接見る</text></g>
<g data-state="branch-growth"><text x="28" y="40" class="heading">branchの目印が進む前と後</text><text x="35" y="89" class="strong">前</text><text x="365" y="89" class="strong">後</text><path class="line" d="M 75 510 V 290"/><circle class="commit" cx="75" cy="510" r="13"/><circle class="commit" cx="75" cy="400" r="13"/><circle class="commit" cx="75" cy="290" r="13"/><path class="line" d="M 75 400 L 215 350"/><path class="line" d="M 215 350 V 350"/><circle class="commit" cx="215" cy="350" r="13"/><rect class="marker" x="53" y="268" width="44" height="44" rx="5"/><rect class="marker" x="193" y="328" width="44" height="44" rx="5"/><text x="47" y="245" class="strong">main</text><text x="171" y="283" class="strong">add/new-</text><text x="171" y="309" class="strong">algorithm</text><text x="28" y="518" class="">m1</text><text x="28" y="408" class="">m2</text><text x="28" y="298" class="">m3</text><text x="240" y="358" class="">b1</text><path class="line" d="M 375 510 V 190"/><circle class="commit" cx="375" cy="510" r="13"/><circle class="commit" cx="375" cy="430" r="13"/><circle class="commit" cx="375" cy="350" r="13"/><circle class="commit" cx="375" cy="270" r="13"/><circle class="commit" cx="375" cy="190" r="13"/><path class="line" d="M 375 430 L 525 390"/><path class="line" d="M 525 390 V 230"/><circle class="commit" cx="525" cy="390" r="13"/><circle class="commit" cx="525" cy="310" r="13"/><circle class="commit" cx="525" cy="230" r="13"/><rect class="marker" x="353" y="168" width="44" height="44" rx="5"/><rect class="marker" x="503" y="208" width="44" height="44" rx="5"/><text x="347" y="145" class="strong">main</text><text x="481" y="163" class="strong">add/new-</text><text x="481" y="189" class="strong">algorithm</text><text x="328" y="518" class="">m1</text><text x="328" y="438" class="">m2</text><text x="328" y="358" class="">m3</text><text x="328" y="278" class="">m4</text><text x="328" y="198" class="">m5</text><text x="550" y="398" class="">b1</text><text x="550" y="318" class="">b2</text><text x="550" y="238" class="">b3</text><path class="arrow" d="M 275 355 H 320 m -9 -7 l 9 7 l -9 7"/><text x="160" y="568" class="">それぞれの作業でcommitを追加</text><text x="205" y="604" class="">HEADの表示は省略</text></g>
<g data-state="create"><text x="28" y="40" class="heading">branch作成と、名前の一覧</text><text x="32" y="85" class="strong">作成前</text><text x="330" y="85" class="strong">作成後</text><path class="line" d="M 100 310 V 190"/><circle class="commit" cx="100" cy="310" r="13"/><circle class="commit" cx="100" cy="250" r="13"/><circle class="commit" cx="100" cy="190" r="13"/><rect class="marker" x="78" y="168" width="44" height="44" rx="5"/><path class="line" d="M 350 310 V 190"/><circle class="commit" cx="350" cy="310" r="13"/><circle class="commit" cx="350" cy="250" r="13"/><circle class="commit" cx="350" cy="190" r="13"/><rect class="marker" x="328" y="168" width="44" height="44" rx="5"/><text x="136" y="193" class="strong">main</text><text x="136" y="140" class="red">HEAD</text><path class="head-arrow" d="M 165 148 V 165 m -5 -6 l 5 6 l 5 -6"/><text x="388" y="148" class="strong">main</text><text x="388" y="100" class="red">HEAD</text><path class="head-arrow" d="M 420 108 V 120 m -5 -6 l 5 6 l 5 -6"/><text x="388" y="213" class="strong">feature/name</text><path class="line" d="M 373 190 H 380 V 141 H 386 M 380 190 V 206 H 386"/><path class="arrow" d="M 230 245 H 280 m -9 -7 l 9 7 l -9 7"/><text x="28" y="382" class="strong">git branch</text><text x="326" y="382" class="strong">.git/refs/heads</text><text x="28" y="427" class="">  feature/name</text><text x="28" y="466" class="">* main</text><text x="326" y="427" class="">├─ feature/</text><text x="326" y="466" class="">│  └─ name</text><text x="326" y="505" class="">└─ main</text><text x="28" y="562" class="">* は現在のbranch。作成だけでは移動しない</text><text x="28" y="601" class="">右は、名前を管理する階層の概念図</text></g>
<g data-state="push-pr"><text x="28" y="40" class="heading">共有先でのmergeを提案する</text><text x="32" y="88" class="strong">PR作成時</text><text x="347" y="88" class="strong">merge後（例）</text><path class="line" d="M 75 500 V 340"/><circle class="commit" cx="75" cy="500" r="13"/><circle class="commit" cx="75" cy="420" r="13"/><circle class="commit" cx="75" cy="340" r="13"/><path class="line" d="M 75 420 L 210 460"/><path class="line" d="M 210 460 V 380"/><circle class="commit" cx="210" cy="460" r="13"/><circle class="commit" cx="210" cy="380" r="13"/><rect class="marker" x="53" y="318" width="44" height="44" rx="5"/><rect class="marker" x="188" y="358" width="44" height="44" rx="5"/><text x="32" y="130" class="red">origin/HEAD</text><text x="32" y="178" class="strong">origin/main</text><path class="head-arrow" d="M 90 137 V 148 m -5 -6 l 5 6 l 5 -6"/><path class="line" d="M 83 187 L 75 316"/><text x="149" y="332" class="strong">feature/name</text><path class="line" d="M 210 340 V 355"/><text x="234" y="468" class="">b1</text><text x="234" y="388" class="">b2</text><path class="line" d="M 395 500 V 240"/><circle class="commit" cx="395" cy="500" r="13"/><circle class="commit" cx="395" cy="420" r="13"/><circle class="commit" cx="395" cy="340" r="13"/><circle class="commit" cx="395" cy="240" r="13"/><path class="line" d="M 395 420 L 540 460"/><path class="line" d="M 540 460 V 380"/><circle class="commit" cx="540" cy="460" r="13"/><circle class="commit" cx="540" cy="380" r="13"/><path class="line" d="M 395 240 L 540 380"/><rect class="marker" x="373" y="218" width="44" height="44" rx="5"/><rect class="marker" x="518" y="358" width="44" height="44" rx="5"/><text x="352" y="130" class="red">origin/HEAD</text><text x="352" y="178" class="strong">origin/main</text><path class="head-arrow" d="M 410 137 V 148 m -5 -6 l 5 6 l 5 -6"/><path class="line" d="M 403 187 L 395 216"/><text x="479" y="332" class="strong">feature/name</text><path class="line" d="M 540 340 V 355"/><text x="564" y="468" class="">b1</text><text x="564" y="388" class="">b2</text><text x="424" y="247" class="">merge</text><text x="28" y="565" class="">PRは変更の統合を提案する場所</text><text x="28" y="603" class="">共有先のmerge後も、手元は自動更新されない</text></g>
</svg>
