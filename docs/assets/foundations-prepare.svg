<svg xmlns="http://www.w3.org/2000/svg" class="foundations-prepare" viewBox="0 0 520 480" role="img" aria-labelledby="prepare-title prepare-desc" data-current-state="tools"><title id="prepare-title">GitとSSHの準備</title><desc id="prepare-desc">Gitの導入、作者情報、秘密鍵と公開鍵、公開鍵の登録、接続設定、認証確認を順に示します。秘密鍵は手元に残し、公開鍵だけをGitHubへ登録します。</desc><defs><marker id="prepare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#218358"/></marker></defs><style><![CDATA[
svg.foundations-prepare { background:#fbfdfc; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; color:#1a211e;
[data-state] { display:none; }
&[data-current-state="tools"] [data-state="tools"] { display:block; }
&[data-current-state="identity"] [data-state="identity"] { display:block; }
&[data-current-state="keys"] [data-state="keys"] { display:block; }
&[data-current-state="register"] [data-state="register"] { display:block; }
&[data-current-state="config"] [data-state="config"] { display:block; }
&[data-current-state="connect"] [data-state="connect"] { display:block; }
text { fill:#1a211e; font-size:22px; }
.heading { font-size:26px; font-weight:700; }
.label { fill:#218358; font-weight:600; }
.center { text-anchor:middle; }
.box { fill:#f7f9f8; stroke:#cbcfcd; stroke-width:2; }
.accent { fill:#e6f6eb; stroke:#218358; stroke-width:3; }
.arrow { fill:none; stroke:#218358; stroke-width:3; marker-end:url(#prepare-arrow); }
}
]]></style><g data-state="tools"><text x="36" y="48" class="heading">Gitを使うターミナル</text><rect x="48" y="88" width="424" height="250" rx="14" class="accent"/><text x="66" y="124" class="">自分のPC</text><text x="66" y="156" class="">Windows → Git Bash</text><text x="66" y="188" class="">macOS / Linux → bash・zsh</text><text x="66" y="220" class="">git --version</text><text x="66" y="252" class="">pwd：現在のフォルダー</text><text x="48" y="396" class="">コマンドを入力する場所を確認</text></g><g data-state="identity"><text x="36" y="48" class="heading">commitに残る作者情報</text><rect x="62" y="100" width="396" height="210" rx="14" class="accent"/><text x="80" y="136" class="">commit</text><text x="80" y="168" class="">user.name → 作者の名前</text><text x="80" y="200" class="">user.email → 作者のメール</text><text x="80" y="232" class="">メッセージ → 変更の説明</text><text x="62" y="378" class="">認証パスワードの設定とは別</text></g><g data-state="keys"><text x="36" y="48" class="heading">SSH鍵はペアで作る</text><rect x="56" y="92" width="408" height="100" rx="14" class="accent"/><text x="74" y="128" class="">秘密鍵：id_ed25519_github</text><text x="74" y="160" class="">自分のPCに保つ</text><rect x="56" y="244" width="408" height="100" rx="14" class="box"/><text x="74" y="280" class="">公開鍵：末尾が.pub</text><text x="74" y="312" class="">GitHubへ登録する</text><text x="56" y="410" class="">秘密鍵にはパスフレーズを設定</text></g><g data-state="register"><text x="36" y="48" class="heading">送るのは公開鍵だけ</text><rect x="52" y="82" width="416" height="96" rx="14" class="box"/><text x="70" y="118" class="">自分のPC</text><text x="70" y="150" class="">id_ed25519_github.pub</text><path d="M260 178 L260 254" class="arrow"/><text x="278" y="222" class="label">公開鍵を登録</text><rect x="52" y="266" width="416" height="96" rx="14" class="accent"/><text x="70" y="302" class="">GitHubアカウント</text><text x="70" y="334" class="">SSH keys</text><text x="52" y="422" class="">秘密鍵は共有先へ送らない</text></g><g data-state="config"><text x="36" y="48" class="heading">接続設定と鍵名を揃える</text><rect x="46" y="84" width="428" height="132" rx="14" class="box"/><text x="64" y="120" class="">~/.ssh/config</text><text x="64" y="152" class="">Host github.com</text><text x="64" y="184" class="">IdentityFile → 秘密鍵</text><path d="M260 216 L260 286" class="arrow"/><rect x="46" y="298" width="428" height="100" rx="14" class="accent"/><text x="64" y="334" class="">~/.ssh/</text><text x="64" y="366" class="">id_ed25519_github</text></g><g data-state="connect"><text x="36" y="48" class="heading">認証成功を確かめる</text><rect x="54" y="82" width="412" height="96" rx="14" class="box"/><text x="72" y="118" class="">自分のPC</text><text x="72" y="150" class="">ssh -T git@github.com</text><path d="M260 178 L260 250" class="arrow"/><text x="278" y="220" class="label">SSHで認証</text><rect x="54" y="264" width="412" height="96" rx="14" class="accent"/><text x="72" y="300" class="">GitHub</text><text x="72" y="332" class="">Hi 自分のアカウント名!</text><text x="54" y="422" class="">初回はホスト鍵の指紋も照合</text></g></svg>