<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="図と実践で学ぶ、研究室のためのGitゼミ。自学習と講義で共通の教材を使います。">
    <title>Gitゼミ — 履歴を残し、共同でつくる</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="markdown.css">
    <script src="markdown.js" defer></script>
    <script src="commit-graph.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <a class="site-brand" href="#toc">Gitゼミ</a>
      <nav id="mode-links" aria-label="教材の表示モード"></nav>
    </header>

    <main id="main">
      <section id="toc-view" class="toc-view" aria-labelledby="toc-title">
        <div class="toc-intro">
          <h1 id="toc-title">履歴を残し、<br>共同でつくる。</h1>
          <p class="intro-description">個人開発から共同開発まで、図とコマンドで学ぶGit入門。</p>
        </div>
        <div class="toc-section-heading"><h2>目次</h2></div>
        <div id="chapter-list" class="chapter-list"></div>
        <p id="course-status" class="toc-footnote"></p>
      </section>

      <section id="study-view" class="study-view" hidden aria-labelledby="lesson-title">
        <nav id="study-breadcrumbs" class="breadcrumbs" aria-label="現在の位置"></nav>
        <div class="lesson-heading">
          <h1 id="lesson-title"></h1>
          <p id="lesson-description" class="lesson-description"></p>
          <details class="lesson-outline">
            <summary>この節の内容</summary>
            <nav id="lesson-outline" aria-label="このSectionのSteps"></nav>
          </details>
        </div>
        <div class="study-layout">
          <aside class="diagram-panel" aria-label="説明に対応する図">
            <div id="study-diagram" class="diagram-container"></div>
            <p id="study-diagram-caption" class="diagram-caption" aria-live="polite"></p>
            <button id="enlarge-study-diagram" class="diagram-enlarge" type="button">図を大きく見る</button>
          </aside>
          <div id="lesson-steps" class="lesson-steps"></div>
        </div>
        <aside id="lesson-sources" class="lesson-sources" aria-label="このSectionの参考資料"></aside>
        <div class="lesson-end"><a id="lesson-present-link" href="#toc">講義表示で開く <span aria-hidden="true">→</span></a></div>
        <nav id="chapter-navigation" class="section-navigation" aria-label="前後のSection"></nav>
      </section>

      <section id="present-view" class="present-view" hidden aria-labelledby="present-title">
        <nav id="present-breadcrumbs" class="breadcrumbs" aria-label="現在の位置"></nav>
        <div class="present-heading"><h1 id="present-title"></h1><button id="enlarge-present-diagram" class="diagram-enlarge" type="button">図を大きく見る</button></div>
        <div class="present-content">
          <div id="present-diagram" class="present-diagram"></div>
          <div class="present-copy"><p id="present-takeaway" class="present-takeaway" aria-live="polite"></p><div id="present-description" class="present-description"></div><div id="present-command" class="present-command"></div><div id="present-notes" class="present-notes"></div></div>
        </div>
        <footer class="present-controls">
          <a id="back-to-study" href="#toc">説明を読む</a>
          <div class="step-navigation"><button id="previous-step" type="button" aria-label="前の説明へ">← <span>前へ</span></button><span id="present-progress" aria-live="polite"></span><button id="next-step" type="button" aria-label="次の説明へ"><span>次へ</span> →</button></div>
        </footer>
      </section>
      <section id="error-view" class="toc-view" hidden aria-labelledby="error-title">

        <h1 id="error-title">ページが見つかりません</h1>
        <p>指定されたChapter・Section・Stepを確認できませんでした。</p>
        <p><code id="unknown-route"></code></p>
        <a href="#toc">目次からSectionを選ぶ →</a>
      </section>
    </main>
    <dialog id="diagram-dialog" aria-label="図の拡大表示">
      <button id="close-diagram-dialog" type="button" autofocus>閉じる（Esc）</button>
      <div id="large-diagram" tabindex="0" aria-label="拡大した図"></div>
      <p id="large-diagram-caption"></p>
    </dialog>
    <footer class="site-footer"><span>Gitゼミ　<a href="credits.html">素材と出典</a></span></footer>
  </body>
</html>
